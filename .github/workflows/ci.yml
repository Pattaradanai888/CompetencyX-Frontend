name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: '1'
  # The backend the end-to-end job checks out and runs. Override with
  # repository variables to pin a branch or a fork.
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'Pattaradanai888/CompetencyX-Backend' }}
  BACKEND_REF: ${{ vars.BACKEND_REF || 'main' }}

jobs:
  checks:
    name: Lint, format, typecheck, unit + nuxt tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:nuxt
      - run: pnpm build

  e2e:
    # The real frontend against the real backend, driven through a browser.
    # Everything else mocks the API at the composable seam; this is the one
    # job that exercises the HTTP contract end to end.
    name: End-to-end (real frontend + real backend)
    runs-on: ubuntu-latest
    env:
      BACKEND_PORT: '8000'
      FRONTEND_PORT: '3000'
    steps:
      - uses: actions/checkout@v4

      - name: Check out the backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: backend
          # A private backend needs a token that can read it; a public one
          # works with the default token.
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version-file: backend/.python-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Start the backend (SQLite, seeded)
        working-directory: backend
        env:
          UV_FROZEN: '1'
          DJANGO_DEBUG: 'true'
          DJANGO_SECRET_KEY: e2e-only-secret-key
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DJANGO_CORS_ALLOW_ALL_ORIGINS: 'true'
          DJANGO_SQLITE_NAME: e2e.sqlite3
        run: |
          uv sync
          uv run python manage.py migrate --noinput
          uv run python manage.py sync_content
          nohup uv run gunicorn config.wsgi:application \
            --bind "127.0.0.1:${BACKEND_PORT}" --workers 2 \
            --access-logfile backend-access.log --error-logfile backend-error.log \
            > backend-stdout.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${BACKEND_PORT}/api/v1/health/" >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 2
          done
          echo "backend did not come up"; cat backend-error.log; exit 1

      - name: Build and start the frontend
        env:
          NUXT_PUBLIC_API_BASE: http://127.0.0.1:${{ env.BACKEND_PORT }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          HOST=127.0.0.1 PORT="${FRONTEND_PORT}" nohup node .output/server/index.mjs > frontend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${FRONTEND_PORT}/" >/dev/null; then
              echo "frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "frontend did not come up"; cat frontend.log; exit 1

      - name: Install Chromium for Playwright
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Run the end-to-end suite
        env:
          E2E_BASE_URL: http://127.0.0.1:${{ env.FRONTEND_PORT }}
          E2E_API_BASE: http://127.0.0.1:${{ env.BACKEND_PORT }}
        run: pnpm test:e2e

      - name: Upload server logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            frontend.log
            backend/backend-*.log
            test-results/
          if-no-files-found: ignore

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
